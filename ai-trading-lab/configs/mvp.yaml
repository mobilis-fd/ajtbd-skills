# AI Trading Lab — research MVP v0.1 configuration.
# PRE-REGISTERED: all rules, parameters and split boundaries below were fixed
# before any backtest was run (see DECISIONS.md, EXPERIMENT_LOG.md).
# Do NOT edit to improve results. Any change => new experiment id + log entry.

experiment_id: MVP-v0.1-E01E02
mode: research_replay          # never "live"
dry_run: true

data:
  source: binance_public_data   # https://data.binance.vision
  base_url: https://data.binance.vision/data/spot
  market: spot
  interval: 1m
  symbols: [BTCUSDT, ETHUSDT, SOLUSDT]   # fixed priority order for simultaneous signals
  start: "2025-11-01T00:00:00Z"         # inclusive
  end: "2026-11-01T00:00:00Z"           # exclusive
  warmup_days: 7                        # candles from 2025-10-25 used only for indicator warmup
  raw_dir: data/raw
  processed_dir: data/processed
  manifest: data/manifest.json

splits:                                  # all [start, end) UTC
  development: {start: "2025-11-01T00:00:00Z", end: "2026-06-08T00:00:00Z"}
  validation:  {start: "2026-06-08T00:00:00Z", end: "2026-08-20T00:00:00Z"}
  test:        {start: "2026-08-20T00:00:00Z", end: "2026-11-01T00:00:00Z", locked: true}

features:
  z_window: 288          # previous returns, current excluded, ddof=0
  rv_window: 48          # previous volumes for median
  breakout_window: 12    # previous highs
  require_full_window: true   # any missing candle inside a window => no signal

strategies:
  E01-P:
    family: E01
    hold_minutes: 30
    rules: {z5_prev_max: -2.0, r5_prev_max: -0.004, r5_min_exclusive: 0.0, close_gt_open: true, rv_prev_min: 1.5}
  E01-F:
    family: E01
    hold_minutes: 30
    rules: {z5_prev_max: -2.0, r5_prev_max: -0.004, r5_min_exclusive: 0.0, close_gt_open: true, rv_prev_min: 1.5,
            imb_prev_max: -0.20, imb_min: 0.0}
  E02-P:
    family: E02
    hold_minutes: 60
    rules: {r15_min: 0.005, z15_min: 2.0, breakout: true, rv_min: 1.5}
  E02-F:
    family: E02
    hold_minutes: 60
    rules: {r15_min: 0.005, z15_min: 2.0, breakout: true, rv_min: 1.5, imb_min: 0.20}

baselines:
  B00: {kind: cash}
  B01: {kind: freqtrade_sample_adapted, upstream: "freqtrade==2026.10 freqtrade/templates/sample_strategy.py (SampleStrategy, entry rules only)",
        hold_minutes_variants: [30, 60]}
  B02: {kind: buy_and_hold, stake: 50.0}
  B03: {kind: random_entries, n_seeds: 100, base_seed: 20261125, match: [E01-P, E01-F, E02-P, E02-F]}

execution:
  side: long_only_spot
  stake_usdt: 50.0
  max_open_trades: 1
  entry: next_1m_open_after_signal_close
  stress_delay_seconds: 60
  stop_pct: 0.006          # below actual entry fill price
  target_pct: 0.009        # above actual entry fill price
  cooldown_minutes: 5
  same_minute_conflict: stop_first
  gap_through_stop: fill_at_open
  gap_through_target: fill_at_trigger
  time_exit: at_1m_open_before_range_check

costs:
  scenarios:               # bps per side; main = 10 fee + 2.5 adverse price adj = 25 bps round trip
    main:   {fee_bps: 10.0, slip_bps: 2.5, delay_seconds: 0}
    rt0:    {fee_bps: 0.0,  slip_bps: 0.0, delay_seconds: 0, hypothetical: true}
    rt10:   {fee_bps: 4.0,  slip_bps: 1.0, delay_seconds: 0, hypothetical: true}
    rt40:   {fee_bps: 16.0, slip_bps: 4.0, delay_seconds: 0, hypothetical: true}
    delay60: {fee_bps: 10.0, slip_bps: 2.5, delay_seconds: 60}
  fee_currency: quote      # simplification, see DECISIONS.md

exchange_filters:          # ASSUMED (public exchangeInfo unavailable from this host, HTTP restricted location)
  source: assumed_from_binance_documentation_not_verified
  BTCUSDT: {tick_size: 0.01, step_size: 0.00001, min_notional: 5.0}
  ETHUSDT: {tick_size: 0.01, step_size: 0.0001, min_notional: 5.0}
  SOLUSDT: {tick_size: 0.01, step_size: 0.001, min_notional: 5.0}
  sensitivity_coarse_step_multiplier: 10

risk:
  initial_equity: 100.0
  daily_loss_limit: 1.5     # USDT from UTC day-start equity (mark-to-market)
  total_loss_limit: 10.0    # USDT from initial equity
  no_leverage: true
  no_short: true
  no_averaging: true

regime:                     # past-only features; thresholds fixed from development data
  return_lookback_candles: 288     # trailing 24h log return sign
  vol_lookback_candles: 288        # trailing std of r5
  vol_threshold: development_median_per_symbol
  thresholds_file: configs/regime_thresholds.json

evaluation:
  windows_days: [4, 7]
  rolling_days: 7
  bootstrap: {block_days: 7, sensitivity_block_days: [3, 14], n_boot: 2000, seed: 20261125, min_blocks: 5}
  multiple_testing: holm
  n_candidates: 4
  event_study_horizons_min: [15, 30, 60]
  annualization_days: 365
